<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarvelUs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #070b14;
      color: #e8e6dc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    
    p {
      font-size: 1rem;
      color: #b0aea5;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }
    
    .projects {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .project-link {
      display: block;
      padding: 1rem 1.25rem;
      background: rgba(232, 230, 220, 0.03);
      border: 1px solid rgba(232, 230, 220, 0.1);
      border-radius: 8px;
      color: #e8e6dc;
      text-decoration: none;
      transition: all 0.2s;
      font-size: 0.95rem;
    }
    
    .project-link:hover {
      background: rgba(232, 230, 220, 0.06);
      border-color: rgba(232, 230, 220, 0.2);
      transform: translateX(4px);
    }
    
    @media (max-width: 640px) {
      h1 {
        font-size: 2rem;
      }
      
      body {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MarvelUs</h1>
    <p>Public project index</p>
    
    <div class="projects">
      <a href="/readiness/" class="project-link">AI Readiness Assessment</a>
      <a href="/foresight-shop/" class="project-link">Foresight Shop</a>
      <a href="/claude-for-business/" class="project-link">Claude for Business seminar</a>
      <a href="/versa-agent-portfolio/" class="project-link">Making an agent better</a>
      <a href="https://marvelus-tech.github.io/sorted-landing/" class="project-link">SORTED</a>
      <a href="/brownstone-audio/" class="project-link">Brownstone Audio</a>
      <a href="/gesture-video-player/" class="project-link">Gesture video player</a>
      <a href="/marvelus-seo-presentation/" class="project-link">SEO presentation</a>
    </div>
  </div>
</body>
</html>
