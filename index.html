<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MarvelUs public project directory — explore our collection of AI, audio, and web experiences.">
  <title>MarvelUs — Project Directory</title>
  <style>
    :root {
      --surface-primary: #ffffff;
      --surface-secondary: #f5f5f7;
      --surface-elevated: rgba(255, 255, 255, 0.72);
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-hover: rgba(0, 0, 0, 0.12);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
      --shadow-pressed: 0 1px 2px rgba(0, 0, 0, 0.06);
      --spring-fast: cubic-bezier(0.4, 0.0, 0.2, 1);
      --spring-bounce: cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: light;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(to bottom, #fafafa 0%, #f5f5f7 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    header {
      margin-bottom: 3.5rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 590;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      background: linear-gradient(135deg, #1d1d1f 0%, #424245 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.0625rem;
      font-weight: 400;
      letter-spacing: 0.011em;
      color: var(--text-secondary);
      line-height: 1.47;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      backdrop-filter: blur(20px);
      background: var(--surface-elevated);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
    }

    .project-link {
      position: relative;
      display: flex;
      align-items: center;
      padding: 1.125rem 1.375rem;
      background: var(--surface-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 510;
      letter-spacing: 0.007em;
      transition: all 180ms var(--spring-fast);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .project-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(0, 113, 227, 0.02) 100%);
      opacity: 0;
      transition: opacity 200ms var(--spring-fast);
    }

    .project-link::after {
      content: '→';
      margin-left: auto;
      font-size: 1.125rem;
      color: var(--text-tertiary);
      transition: all 200ms var(--spring-bounce);
      transform: translateX(-4px);
      opacity: 0;
    }

    .project-link:hover {
      transform: translateY(-1px) scale(1.0025);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
      background: var(--surface-primary);
    }

    .project-link:hover::before {
      opacity: 1;
    }

    .project-link:hover::after {
      transform: translateX(0);
      opacity: 1;
      color: var(--accent);
    }

    .project-link:active {
      transform: scale(0.9925);
      box-shadow: var(--shadow-pressed);
      transition-duration: 80ms;
    }

    .project-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      
      .project-link:hover {
        transform: none;
      }
      
      .project-link:active {
        transform: none;
      }
      
      .project-link::after {
        transform: none;
      }
      
      .project-link:hover::after {
        transform: none;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 2rem 1.25rem;
      }

      header {
        margin-bottom: 2.5rem;
      }

      .projects {
        padding: 0.75rem;
        border-radius: 16px;
      }

      .project-link {
        padding: 1rem 1.125rem;
        font-size: 0.875rem;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .container {
        max-width: 600px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MarvelUs</h1>
      <p class="subtitle">Explore our collection of AI, audio, and web experiences</p>
    </header>
    
    <nav class="projects" role="navigation" aria-label="Project directory">
      <a href="/readiness/" class="project-link">AI Readiness Assessment</a>
      <a href="https://marvelus-tech.github.io/tko-intel-feed/" class="project-link">TKO Intel Feed</a>
      <a href="/foresight-shop/" class="project-link">Foresight Shop</a>
      <a href="/claude-for-business/" class="project-link">Claude for Business seminar</a>
      <a href="/versa-agent-portfolio/" class="project-link">Making an agent better</a>
      <a href="https://marvelus-tech.github.io/sorted-landing/" class="project-link">SORTED</a>
      <a href="/solana-alpha/" class="project-link">Solana Alpha</a>
      <a href="/brownstone-audio/" class="project-link">Brownstone Audio</a>
      <a href="/gesture-video-player/" class="project-link">Gesture video player</a>
      <a href="https://marvelus-tech.github.io/rr-dashboard/" class="project-link">Rank &amp; Rent</a>
      <a href="/marvelus-seo-presentation/" class="project-link">SEO presentation</a>
    </nav>
  </div>
</body>
</html>
