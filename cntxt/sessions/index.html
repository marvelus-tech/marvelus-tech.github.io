<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNTXT | Sessions</title>
  <meta name="description" content="Start a named CNTXT session or open the 1992 debate demo. Each session becomes a cited, browsable presentation.">
  <link rel="canonical" href="https://marvelus-tech.github.io/cntxt/sessions/">
  <meta name="theme-color" content="#f7f4ee">
  <link rel="stylesheet" href="../shared.css">
  <style>
    .hub {
      width: min(42rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .lede {
      margin-top: 0.65rem;
      color: var(--muted);
      max-width: 36rem;
    }
    .new-session {
      margin-top: 2rem;
      padding: 1.1rem 1.15rem;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .new-session label {
      display: block;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    #session-name {
      width: 100%;
      font: inherit;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      background: var(--paper);
      margin-bottom: 0.85rem;
    }
    .new-session__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .session-list {
      margin-top: 2.5rem;
      list-style: none;
      padding: 0;
    }
    .session-list h2 {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }
    .session-card {
      display: block;
      padding: 1rem 1.1rem;
      border: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      margin-bottom: 0.65rem;
      background: rgba(255, 255, 255, 0.28);
    }
    .session-card:hover {
      border-color: var(--ink);
    }
    .session-card h3 {
      font-size: 1.05rem;
      font-weight: 650;
      margin-bottom: 0.35rem;
    }
    .session-card p {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .session-card .kind {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <a class="skip" href="#sessions">Skip to sessions</a>
  <header class="cntxt-top">
    <a class="cntxt-brand" href="../">CNTXT</a>
    <div class="cntxt-top__actions">
      <a class="cntxt-link" href="../">Home</a>
    </div>
  </header>

  <main class="hub">
    <h1>Sessions</h1>
    <p class="lede">Name a session, record or upload audio, and CNTXT turns it into cited topic pages you can browse like a presentation.</p>

    <section class="new-session" aria-labelledby="new-heading">
      <h2 id="new-heading" class="sr-only">New session</h2>
      <label for="session-name">Session name</label>
      <input id="session-name" type="text" name="sessionName" placeholder="e.g. Team standup, Nov 22" autocomplete="off" required>
      <div class="new-session__actions">
        <button type="button" class="btn-primary" id="btn-record">Record</button>
        <a class="btn-secondary" href="./1992-debate/" style="display:inline-flex;align-items:center;text-decoration:none">Open demo</a>
      </div>
      <p class="toast" id="record-toast" hidden role="status"></p>
    </section>

  </main>

  <section class="hub" id="sessions" aria-labelledby="list-heading" style="padding-top:0">
    <ul class="session-list">
      <li>
        <h2 id="list-heading">Your sessions</h2>
        <ul id="session-list" style="list-style:none;padding:0"></ul>
      </li>
    </ul>
  </section>

  <footer class="cntxt-foot">
    <p>Demo session uses a public-domain 1992 debate clip.</p>
    <p><a href="../">CNTXT home</a> · <a href="/">MarvelUs</a></p>
  </footer>

  <script type="module">
    const RECORD_MSG =
      "Recording and saving sessions need storage and sign-in (coming soon). Use the demo session to explore cited topics today.";

    document.getElementById("btn-record").addEventListener("click", () => {
      const name = document.getElementById("session-name").value.trim();
      const toast = document.getElementById("record-toast");
      if (!name) {
        toast.hidden = false;
        toast.textContent = "Name your session first.";
        document.getElementById("session-name").focus();
        return;
      }
      toast.hidden = false;
      toast.textContent = RECORD_MSG;
    });

    const listEl = document.getElementById("session-list");
    const manifest = await fetch("./sessions.json").then((r) => r.json());
    for (const item of manifest) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "session-card";
      a.href = item.href;
      const kind = item.kind === "demo" ? "Demo" : "Session";
      a.innerHTML = `<p class="kind">${kind}</p><h3>${item.title}</h3><p>${item.topicCount} topics · ${item.durationLabel}</p>`;
      li.appendChild(a);
      listEl.appendChild(li);
    }
  </script>
</body>
</html>
